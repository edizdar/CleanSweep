name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CleanSweep.sln
      - name: Build
        run: dotnet build CleanSweep.sln -c Release --no-restore
      - name: Test
        run: dotnet test CleanSweep.sln -c Release --no-build --verbosity normal
